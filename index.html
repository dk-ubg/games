<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK UBG - 4000+ G@m3s</title>
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/dk-ubg/games@main/assets/dk-ubg.png">
    <style id="theme-logic">
        :root {
            --bg-dark: #050c09; --bg-medium: #0d1f18; --accent: #ff4d6d;
            --accent-glow: rgba(255, 77, 109, 0.5); --text-main: #95d5b2;
            --nav-width: 70px; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100%; height: 100vh; background: var(--bg-dark); font-family: 'Segoe UI', sans-serif; display: flex; overflow: hidden; color: white; transition: 0.3s ease; }
        
        /* Sidebar */
        .side-nav { 
            width: var(--nav-width); height: 100%; background: var(--bg-medium); 
            border-right: 1px solid rgba(255,255,255,0.1); display: flex; 
            flex-direction: column; align-items: center; padding: 20px 0; z-index: 10; 
        }
        .nav-item { 
            width: 50px; height: 50px; margin-bottom: 15px; display: flex; 
            align-items: center; justify-content: center; color: var(--text-main); 
            border-radius: 12px; cursor: pointer; transition: 0.3s; opacity: 0.6; 
        }
        .nav-item:hover { opacity: 1; background: rgba(255,255,255,0.05); }
        .nav-item svg{width:20px;height:20px;fill:currentColor}
        .nav-item.active { opacity: 1; background: var(--accent); color: white; box-shadow: 0 0 20px var(--accent-glow); }
        .nav-item svg { width: 24px; height: 24px; }
        
        #sys-clock { 
            font-size: 10px; font-weight: bold; color: var(--accent); 
            margin-bottom: 20px; display: none; text-align: center;
        }

        .nav-bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; }

      
        .main-viewport { flex-grow: 1; height: 100%; position: relative; }
        #content-frame { width: 100%; height: 100%; border: none; }

       
        .settings-modal { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: var(--bg-medium); border: 2px solid var(--accent); 
            padding: 25px; border-radius: 20px; width: 420px; max-height: 85vh; overflow-y: auto;
            z-index: 100; box-shadow: 0 0 60px rgba(0,0,0,0.8); display: none; flex-direction: column; gap: 15px; 
        }
        .settings-modal.active { display: flex; }
        .setting-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-main); }
        select, input[type="color"] { width: 100%; padding: 10px; background: var(--bg-dark); color: white; border: 1px solid var(--accent); border-radius: 8px; outline: none; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .action-btn { padding: 12px; background: var(--bg-dark); border: 1px solid var(--accent); color: white; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .action-btn:hover { background: var(--accent); }
    </style>
</head>
<body>

    <nav class="side-nav">
        <div id="sys-clock">00:00</div>
        <div class="nav-item active" id="nav-home" onclick="loadPage('home')" title="Home">
            <svg viewBox="0 0 512 512"><path d="M277.8 8.6c-12.3-11.4-31.3-11.4-43.5 0l-224 208c-9.6 9-12.8 22.9-8 35.1S18.8 272 32 272l16 0 0 176c0 35.3 28.7 64 64 64l288 0c35.3 0 64-28.7 64-64l0-176 16 0c13.2 0 25-8.1 29.8-20.3s1.6-26.2-8-35.1l-224-208zM240 320l32 0c26.5 0 48 21.5 48 48l0 96-128 0 0-96c0-26.5 21.5-48 48-48z"/></svg>
        </div>
        <div class="nav-item" id="nav-games" onclick="loadPage('games')" title="Games">
            <svg viewBox="0 0 640 512"><path d="M448 64c106 0 192 86 192 192S554 448 448 448l-256 0C86 448 0 362 0 256S86 64 192 64l256 0zM192 176c-13.3 0-24 10.7-24 24l0 32-32 0c-13.3 0-24 10.7-24 24s10.7 24 24 24l32 0 0 32c0 13.3 10.7 24 24 24s24-10.7 24-24l0-32 32 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-32 0 0-32c0-13.3-10.7-24-24-24zm240 96a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm64-96a32 32 0 1 0 0 64 32 32 0 1 0 0-64z"/></svg>
        </div>
        <div class="nav-item" id="nav-partners" onclick="loadPage('partners')" title="Partners">

        </div>

            <div class="nav-item" onclick="window.open('https://discord.gg/jFu5psyRxT', '_blank')" title="Discord">

            </div>
            <div class="nav-item" onclick="toggleSettings()" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M259.173.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z"/></svg>
            </div>
        </div>
    </nav>

    <main class="main-viewport">
        <iframe id="content-frame"></iframe>
    </main>

    <div class="settings-modal" id="settings-modal">
        <h2 style="color:var(--accent); border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">Settings</h2>
        
        <div class="setting-group">
            <label>Themes</label>
            <select id="theme-select" onchange="applyPreset(this.value)"></select>
        </div>

        <div class="setting-group">
            <label>Clock Visibility</label>
            <div class="btn-grid">
                <button class="action-btn" onclick="toggleClock(true)">Enable</button>
                <button class="action-btn" onclick="toggleClock(false)">Disable</button>
            </div>
        </div>

        <div class="setting-group">
            <label>Export/Import Site Save</label>
            <div class="btn-grid">
                <button class="action-btn" onclick="exportData()">Export Profile</button>
                <button class="action-btn" onclick="importData()">Import Profile</button>
            </div>
        </div>

        <button class="action-btn" onclick="toggleSettings()" style="background:var(--accent); margin-top:10px;">Close</button>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/dk-ubg/games@main/gaming.js">
    </script>
</body>
</html>
